name: Release

# タグ push（v*）で macOS の両アーキテクチャ DMG と Windows（x64）の NSIS インストーラを
# 自動ビルドし、ドラフトリリースに添付する。未署名（macOS は ad-hoc 署名のみ、Tauri が自動付与）。
# 公開前に CHANGELOG 記載・（引き継ぎ回のみ）DMG の Electron 命名リネームを行い、
# ドラフトを手動で publish する運用（updater は releases/latest = 非ドラフトを見るため）。
#
# ビルド（build）とリリース作成（release）を分け、**全ビルドが成功したときだけ**ドラフトを
# 作る。一部の OS だけの成果物で不完全なリリースができるのを防ぐため。
# このファイルを変えた PR では build だけを動かし、タグを打つ前にビルドが通るかを確かめる。

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'

# 同一タグの重複実行を抑止
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin # Apple Silicon
            bundles: dmg
            artifact: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: macos-latest
            target: x86_64-apple-darwin # Intel（macos-latest=arm64 からのクロスビルド）
            bundles: dmg
            artifact: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # ビルド前のガード。CHANGELOG の `## [Unreleased]` をこの版の節へリネームし忘れたまま
      # タグを打つと、アプリ内の「変更点」はビルド時の CHANGELOG を埋め込むため、その版の
      # 変更点が誰にも表示されないまま既読として記録され、二度と出せなくなる。
      # release_notes.rs のテストが現在のバージョンの節の存在を検査するので、ここで止める。
      - name: Guard release notes (cargo test)
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      # tauri build（beforeBuildCommand=vite build 含む）。macOS は DMG、Windows は NSIS のみ
      # 生成する（独自アップデータを使うため updater 用バンドルや MSI は作らない）。
      - name: Build (Tauri, unsigned)
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: juice-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Draft release
    # 全ビルドが成功したときだけ動く（1つでも失敗すればドラフトは作られない）
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # リリース作成・アセットアップロードに必要

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ls -l dist
          cat > notes.md <<'EOF'
          自動ビルド（未署名）。macOS（arm64 / x64）の DMG と Windows（x64）のインストーラを添付しています。

          公開前チェック:
          - CHANGELOG.md の `## [Unreleased]` をこの版の節（`## [X.Y.Z] - YYYY-MM-DD`）へ
            **タグ push 前に**リネーム済みか（アプリ内の「変更点」はビルド時の CHANGELOG を
            埋め込むため、未リネームのままだとこの版の変更点が表示されない。タグを取り直す）
          - CHANGELOG.md の該当節を本文に記載
          - **引き継ぎリリース時のみ**: DMG を Electron 命名へリネーム
            （`Juice_X.Y.Z_aarch64.dmg`→`Juice-X.Y.Z-arm64.dmg`、`_x64.dmg`→`.dmg`）
          - ドラフトを解除して正式公開（pre-release/draft のままだと updater が検知しない）
          EOF
          # 再実行時は既存のドラフトへ上書きアップロードする
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" --draft --title "$TAG" --notes-file notes.md
          fi
